html{min-height:100%;background:#f4f7fb}
body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;color:var(--navy);background:radial-gradient(ellipse at 50% 0%,#e4f1ff 0,transparent 48%),#f7f9fc}
main{width:min(100% - 32px,440px);margin:auto;padding:clamp(48px,12vh,105px) 0 28px}
header{text-align:center;margin-bottom:34px}
.mark{width:66px;height:66px;margin:0 auto 18px;border-radius:22px;background:linear-gradient(145deg,#0b3d70,#1684d5);display:grid;place-items:center;color:white;font-size:30px;font-weight:900;box-shadow:0 12px 26px #0b4a832b}
h1{font-size:clamp(38px,10vw,48px);margin:0;font-weight:900;letter-spacing:-1px}
.latin{direction:ltr;font-size:13px;font-weight:800;letter-spacing:6px;color:#5280aa;margin:7px 0 17px}
.subtitle{margin:0;color:#536b85;font-size:16px;line-height:1.8}
.prompt{font-size:15px;font-weight:700;color:#254c73;text-align:center;margin:0 0 15px}
.actions{display:grid;gap:13px}
.action{min-height:86px;border:1px solid var(--line);border-radius:20px;background:#fff;display:flex;align-items:center;gap:15px;padding:13px 16px;text-decoration:none;color:var(--navy);box-shadow:0 7px 22px #173b6010;transition:transform .16s,box-shadow .16s}
.action:active{transform:scale(.985);box-shadow:0 3px 10px #173b6018}
.icon{width:54px;height:54px;flex:0 0 54px;border-radius:17px;display:grid;place-items:center;color:white}
.icon svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.wifi .icon{background:#176fbd}.wa .icon{background:#16a36a}.tg .icon{background:#219bd2}
.details{min-width:0;flex:1}
.details strong{display:block;font-size:18px;margin-bottom:5px}
.details small{display:block;color:var(--muted);font-size:12px}
.arrow{font-size:27px;color:#9aabba;direction:ltr}
footer{text-align:center;margin-top:30px;color:#91a0b2;font-size:11px;line-height:1.8}
@media(min-height:800px){main{padding-top:clamp(80px,15vh,145px)}}
</style>
